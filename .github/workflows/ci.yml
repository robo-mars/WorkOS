name: WorkplaceOS checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: gateway-go/go.sum }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: make install
      - run: make test
      - run: make eval
      - run: make build
      - name: Real protocol smoke test
        run: |
          .venv/bin/python scripts/dev.py > /tmp/workplace-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID"' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/health; then break; fi
            sleep 1
          done
          .venv/bin/python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: evals/results.json
